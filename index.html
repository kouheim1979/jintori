function startGame(){state={theme:THEMES.find(t=>t.id===theme.value),mode:mode.value,ranking:[],i:0,score:0,combo:0,correct:0,wrong:0,maxCombo:0,hintUsed:false,misses:[]};state.ranking=[...PREFS].sort(state.theme.cmp);state.limit=state.mode==='challenge10'?10:47;title.classList.add('hidden');game.classList.remove('hidden');updatePrompt();}
function updatePrompt(){next.textContent=`次は${state.i+1}位（${state.theme.label}）`;score.textContent=state.score+'点';combo.textContent='COMBO '+state.combo;stats.textContent=`正解${state.correct} 不正解${state.wrong} 残り${state.limit-state.i}`;}
function answer(id){const picked=PREFS.find(p=>p.id===id),target=state.ranking[state.i],rankPicked=state.ranking.findIndex(p=>p.id===id)+1,dist=Math.abs(rankPicked-(state.i+1));const ok=id===target.id,near=state.mode==='kids'&&dist<=2;let delta=ok?100:near?50:-30;if(state.hintUsed)delta-=20;state.score+=delta;document.querySelector(`[data-pref-id="${id}"]`).classList.add(ok||near?'player':'enemy');if(!ok&&!near){document.querySelector(`[data-pref-id="${target.id}"]`).classList.add('answer');state.wrong++;state.misses.push(target.name);state.combo=0;}else{state.correct++;state.combo++;if(state.combo===3)state.score+=100;if(state.combo===5)state.score+=200;if(state.combo===10)state.score+=500;}state.maxCombo=Math.max(state.maxCombo,state.combo);explain.innerHTML=`<h3>${ok?'正解':near?'おしい':'不正解'}</h3><p>正解:${target.name} ${state.i+1}位 ${target[state.theme.key].toLocaleString()}</p><p>選択:${picked.name} ${rankPicked}位 ${picked[state.theme.key].toLocaleString()}</p><p>${target.specialties[0]} / ${target.landmarks[0]}</p>`;state.i++;state.hintUsed=false;if(state.i>=state.limit)return finish();updatePrompt();}
function showHint(){const t=state.ranking[state.i];hintText.textContent=`${t.region}・${t.capital}・値${t[state.theme.key].toLocaleString()}付近`;state.hintUsed=true;}
function finish(){if(state.mode==='all'&&state.correct===47)state.score+=1000;game.classList.add('hidden');result.classList.remove('hidden');const rate=Math.round(state.correct/state.limit*100);result.innerHTML=`<h2>結果</h2><div class='score'>${state.score}点</div><p>正解率${rate}% 最大コンボ${state.maxCombo}</p><p>ミス:${[...new Set(state.misses)].join('、')||'なし'}</p><button onclick='shareResult()'>シェア</button><button onclick='location.reload()'>再挑戦</button>`;safeSet('wolf-best',String(Math.max(+safeGet('wolf-best','0'),state.score)));}
async function shareResult(){try{const text=`完璧な日本地図ウルフで${state.score}点`;if(navigator.share){await navigator.share({text});}else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('コピーしました');}}catch(e){console.warn('share failed',e);}}
startBtn.onclick=startGame;hintBtn.onclick=showHint;setup();
</script></body></html>
