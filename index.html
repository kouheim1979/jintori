<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>都道府県陣取りバトル MVP</title>
  <style>
    :root {
      --bg1: #a7e8ff;
      --bg2: #fef7c3;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --neutral: #b9c0ca;
      --player: #3b82f6;
      --enemy: #ef4444;
      --attack: #facc15;
      --selected: #111827;
      --ok: #16a34a;
      --ng: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height: 100vh;
    }
    .app { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .screen { display: none; animation: fadeIn .25s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from {opacity: .2;} to {opacity: 1;} }
    h1, h2, h3 { margin: 8px 0; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,.1);
      margin-bottom: 14px;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: 12px; padding: 12px 16px; font-size: 16px;
      font-weight: 700; cursor: pointer; min-height: 48px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-main { background: #22c55e; color: #fff; }
    .btn-sub { background: #e5e7eb; color: #111; }
    .guide { font-size: 17px; font-weight: 700; color: #0f766e; }

    .legend { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; font-size:14px; }
    .chip { padding:4px 8px; border-radius:999px; border:2px solid #111; font-weight:700; }
    .chip.neutral { background: var(--neutral); }
    .chip.player { background: var(--player); color: #fff; }
    .chip.enemy { background: var(--enemy); color: #fff; }
    .chip.attack { background: #fff7a8; border-color: var(--attack); }
    .chip.selected { background: #fff; border-width:4px; }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(52px, 1fr));
      gap: 6px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .pref {
      min-height: 46px; border-radius: 10px; border: 2px solid #475569; color: #111;
      font-size: 13px; font-weight: 700; display:flex; align-items:center; justify-content:center;
      text-align:center; padding:4px; cursor:pointer; position: relative;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      background: var(--neutral);
    }
    .pref:hover { transform: translateY(-1px); }
    .pref.player { background: var(--player); color: #fff; }
    .pref.enemy { background: var(--enemy); color: #fff; }
    .pref.attackable { box-shadow: 0 0 0 3px var(--attack) inset; }
    .pref.selected { outline: 4px solid #fff; border-color: var(--selected); }
    .pref.flash { animation: flash .5s ease 2; }
    @keyframes flash { 0%{filter:brightness(1);} 50%{filter:brightness(1.6);} 100%{filter:brightness(1);} }

    .stats { display:grid; grid-template-columns: repeat(3, minmax(130px, 1fr)); gap:8px; }
    .stat { background:#f3f4f6; border-radius:10px; padding:8px; font-weight:700; text-align:center; }
    .log { max-height: 220px; overflow:auto; background:#0b1220; color:#e5e7eb; padding:10px; border-radius:10px; font-size:14px; }
    .log p { margin: 0 0 6px; }

    .quiz-options { display:grid; gap:8px; }
    .quiz-btn { background:#e0f2fe; border:2px solid #0ea5e9; }
    .quiz-btn.correct { background:#bbf7d0; border-color: var(--ok); }
    .quiz-btn.wrong { background:#fecaca; border-color: var(--ng); }
    .shake { animation: shake .35s linear; }
    @keyframes shake {
      0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}
    }

    @media (max-width: 720px) {
      .app { padding: 10px; }
      .btn { font-size: 17px; }
      .pref { min-height: 52px; font-size: 12px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="titleScreen" class="screen active">
      <div class="card">
        <h1>🗾 都道府県陣取りバトル</h1>
        <p>クイズに正解して都道府県をゲット！30ターンでより多くの県を獲得しよう。</p>
        <p class="guide">まずは「はじめる」を押して、本拠地を選んでください。</p>
        <div class="row">
          <button id="startBtn" class="btn btn-main">はじめる</button>
          <button id="howtoBtn" class="btn btn-sub">遊び方</button>
        </div>
      </div>
      <div id="howtoCard" class="card" style="display:none;">
        <h3>遊び方</h3><ol><li>本拠地を1つ選びます。</li><li>隣接県を攻めてクイズに挑戦！</li><li>正解で県を獲得、不正解なら失敗。</li><li>敵AIも毎ターン行動。</li><li>30ターン後の獲得県数で勝負！</li></ol>
      </div>
      <div id="recordCard" class="card"></div>
    </section>

    <section id="baseScreen" class="screen">
      <div class="card"><h2>本拠地を選択</h2><p class="guide">都道府県を1つ選んで「決定」を押してください。</p><div class="legend"><span class="chip neutral">未獲得</span><span class="chip selected">選択中</span></div><div id="baseMap" class="map-grid"></div><div class="row"><button id="baseConfirmBtn" class="btn btn-main" disabled>決定</button><button id="backTitleBtn" class="btn btn-sub">タイトルへ戻る</button></div><p id="baseMsg"></p></div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="card"><h2>メインゲーム</h2><p id="actionGuide" class="guide"></p><div class="stats"><div class="stat" id="turnStat"></div><div class="stat" id="playerStat"></div><div class="stat" id="enemyStat"></div><div class="stat" id="remainStat"></div><div class="stat" id="accStat"></div></div><div class="legend"><span class="chip neutral">未獲得</span><span class="chip player">プレイヤー</span><span class="chip enemy">敵AI</span><span class="chip attack">攻撃可能</span><span class="chip selected">選択中</span></div><div id="gameMap" class="map-grid"></div><p id="selectedInfo">選択中: なし</p><div class="row"><button id="attackBtn" class="btn btn-main" disabled>この県を攻める</button></div></div>
      <div class="card"><h3>ゲームログ</h3><div id="gameLog" class="log"></div></div>
    </section>

    <section id="quizScreen" class="screen">
      <div id="quizCard" class="card"><h2>クイズバトル</h2><p id="quizQ"></p><div id="quizOptions" class="quiz-options"></div><p id="quizResult"></p><p id="quizExp"></p><button id="quizNextBtn" class="btn btn-main" style="display:none;">次へ</button></div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card"><h2>結果発表</h2><h3 id="resultTitle"></h3><p id="resultSummary"></p><div id="finalStats"></div><div class="row"><button id="retryBtn" class="btn btn-main">もう一度遊ぶ</button></div></div>
    </section>
  </div>

const state={screen:"title",prefs:[],turn:1,maxTurn:30,selected:null,playerBase:null,enemyBase:null,quiz:null,canAnswer:true,correct:0,wrong:0,logs:[]};
const el=id=>document.getElementById(id);
function initPrefs(){state.prefs=PREFS.map(p=>({id:p[0],name:p[1],region:p[2],capital:p[3],neighbors:p[4],specialties:p[5],landmarks:p[6],owner:null}));}
function setScreen(s){["title","base","game","quiz","result"].forEach(k=>el(k+"Screen").classList.toggle("active",k===s));state.screen=s;}
function getPref(id){return state.prefs.find(p=>p.id===id)||null;}
function countOwner(owner){return state.prefs.filter(p=>p.owner===owner).length;}
function neutralPrefs(){return state.prefs.filter(p=>!p.owner);}
function playerAttackables(){const own=state.prefs.filter(p=>p.owner==="player");const set=new Set();own.forEach(p=>p.neighbors.forEach(n=>{const t=getPref(n); if(t && !t.owner) set.add(t.id);}));return [...set];}
function log(msg){state.logs.unshift(`T${state.turn}: ${msg}`); el("gameLog").innerHTML=state.logs.slice(0,80).map(v=>`<p>${v}</p>`).join("");}
function mapHtml(containerId,mode){const c=el(containerId); c.innerHTML=""; state.prefs.forEach(p=>{const b=document.createElement("button");b.className="pref";if(p.owner==="player")b.classList.add("player");if(p.owner==="enemy")b.classList.add("enemy");if(state.selected===p.id)b.classList.add("selected");if(mode==="game"&&playerAttackables().includes(p.id))b.classList.add("attackable");b.style.gridColumn=(POS[p.id]?.[0]||1)+"";b.style.gridRow=(POS[p.id]?.[1]||1)+"";b.textContent=p.name.replace("都","\n").replace("府","\n").replace("県","");b.title=p.name;b.onclick=()=>onSelectPref(p.id,mode);c.appendChild(b);});}
function onSelectPref(id,mode){const p=getPref(id);if(!p)return;state.selected=id;if(mode==="base"){el("baseConfirmBtn").disabled=false;el("baseMsg").textContent=`選択中: ${p.name}`;mapHtml("baseMap","base");return;}if(state.screen!=="game")return;const attackables=playerAttackables();let note="";if(p.owner==="player")note="（自分の陣地）";else if(p.owner==="enemy")note="（敵陣地。MVPでは未獲得のみ攻撃可）";else if(!attackables.includes(p.id))note="（隣接していないため攻撃不可）";el("selectedInfo").textContent=`選択中: ${p.name} ${note}`;el("attackBtn").disabled=!(p && !p.owner && attackables.includes(p.id));mapHtml("gameMap","game");}
function renderGame(){const total=countOwner("player")+countOwner("enemy");const answered=state.correct+state.wrong;const acc=answered?Math.round(state.correct/answered*100):0;el("turnStat").textContent=`ターン: ${state.turn}`;el("playerStat").textContent=`プレイヤー: ${countOwner("player")}県`;el("enemyStat").textContent=`敵AI: ${countOwner("enemy")}県`;el("remainStat").textContent=`残りターン: ${Math.max(0,state.maxTurn-state.turn+1)}`;el("accStat").textContent=`正解率: ${acc}%`;el("actionGuide").textContent="自分の陣地に隣接した未獲得県を選んで攻めよう！";mapHtml("gameMap","game");el("selectedInfo").textContent="選択中: なし";el("attackBtn").disabled=true;if(total===47||state.turn>state.maxTurn)finishGame();}
function buildQuiz(pref){const cats=["capital","region","specialty","landmark","neighbor"];const type=cats[Math.floor(Math.random()*cats.length)];let q="",a="",pool=[];if(type==="capital"){q=`${pref.name}の県庁所在地はどこ？`;a=pref.capital;pool=state.prefs.map(p=>p.capital);}else if(type==="region"){q=`${pref.name}が属する地方は？`;a=pref.region;pool=[...new Set(state.prefs.map(p=>p.region))];}else if(type==="specialty"){q=`${pref.name}の名産品として正しいものは？`;a=pref.specialties[0];pool=state.prefs.flatMap(p=>p.specialties);}else if(type==="landmark"){q=`${pref.name}の観光地として正しいものは？`;a=pref.landmarks[0];pool=state.prefs.flatMap(p=>p.landmarks);}else{q=`${pref.name}に隣接している都道府県はどれ？`;const n=pref.neighbors[0]||"";a=(getPref(n)?.name)||"隣接県なし";pool=state.prefs.map(p=>p.name);}pool=[...new Set(pool.filter(x=>x&&x!==a))];while(pool.length<3)pool.push("ダミー選択肢"+Math.random().toString(36).slice(2,5));const wrong=pool.sort(()=>Math.random()-.5).slice(0,3);const opts=[a,...wrong].sort(()=>Math.random()-.5);return {q,a,opts,exp:`正解は「${a}」。${pref.name}の基本情報を覚えよう！`};}
function startQuiz(){const p=getPref(state.selected);if(!p)return;state.quiz=buildQuiz(p);state.canAnswer=true;el("quizQ").textContent=state.quiz.q;el("quizResult").textContent="";el("quizExp").textContent="";el("quizNextBtn").style.display="none";const box=el("quizOptions");box.innerHTML="";state.quiz.opts.forEach(opt=>{const b=document.createElement("button");b.className="btn quiz-btn";b.textContent=opt;b.onclick=()=>answerQuiz(opt,b);box.appendChild(b);});setScreen("quiz");}
function answerQuiz(ans,btn){if(!state.canAnswer)return;state.canAnswer=false;const target=getPref(state.selected);const buttons=[...el("quizOptions").querySelectorAll("button")];buttons.forEach(b=>b.disabled=true);const ok=ans===state.quiz.a;if(ok){state.correct++;target.owner="player";btn.classList.add("correct");el("quizResult").textContent="✅ 正解！県を獲得しました！";log(`プレイヤーが${target.name}を獲得！`);}else{state.wrong++;btn.classList.add("wrong");el("quizCard").classList.add("shake");setTimeout(()=>el("quizCard").classList.remove("shake"),380);el("quizResult").textContent="❌ 不正解…獲得失敗。";log(`プレイヤーの${target.name}攻撃は失敗。`);}el("quizExp").textContent=state.quiz.exp;el("quizNextBtn").style.display="inline-block";}
function aiTurn(){const ai=state.prefs.filter(p=>p.owner==="enemy");let targets=[];ai.forEach(p=>p.neighbors.forEach(n=>{const t=getPref(n);if(t&&!t.owner)targets.push(t.id);}));targets=[...new Set(targets)];if(!targets.length)targets=neutralPrefs().map(p=>p.id);if(!targets.length)return;const tid=targets[Math.floor(Math.random()*targets.length)];const t=getPref(tid);const success=Math.random()<0.7;if(success&&t){t.owner="enemy";log(`敵AIが${t.name}の獲得に成功。`);}else{log(`敵AIが${t?.name||"どこか"}の攻撃に失敗。`);} }
function nextTurn(){aiTurn();state.turn++;state.selected=null;saveStats(false);setScreen("game");renderGame();}
function finishGame(){setScreen("result");const p=countOwner("player"),e=countOwner("enemy");const ans=state.correct+state.wrong;const acc=ans?Math.round(state.correct/ans*100):0;let winner="引き分け";if(p>e)winner="プレイヤーの勝ち！";else if(e>p)winner="敵AIの勝ち";else{const aiAcc=70;if(acc>aiAcc)winner="プレイヤーの勝ち！（正解率判定）";else if(acc<aiAcc)winner="敵AIの勝ち（正解率判定）";}el("resultTitle").textContent=winner;el("resultSummary").textContent=`30ターン終了または全県確保でゲーム終了。`;el("finalStats").innerHTML=`<p>プレイヤー獲得: ${p}県</p><p>敵AI獲得: ${e}県</p><p>正解: ${state.correct} / 不正解: ${state.wrong}</p><p>正解率: ${acc}%</p>`;saveStats(true,winner.includes("プレイヤー"),p);}
function storage(){try{return window.localStorage;}catch{return null;}}
function loadRecord(){const s=storage();const d=s?JSON.parse(s.getItem("jintoriRecord")||"{}"):{},w=d.bestWinRate||0,m=d.bestPref||0,c=d.completeCount||0;el("recordCard").innerHTML=`<h3>記録</h3><p>最高正解率: ${w}%</p><p>最高獲得県数: ${m}県</p><p>全国制覇回数: ${c}回</p>`;}
function saveStats(isEnd,playerWin=false,prefCount=0){if(!isEnd)return;const s=storage();if(!s)return;const d=JSON.parse(s.getItem("jintoriRecord")||"{}");const ans=state.correct+state.wrong;const acc=ans?Math.round(state.correct/ans*100):0;d.bestWinRate=Math.max(d.bestWinRate||0,acc);d.bestPref=Math.max(d.bestPref||0,prefCount);if(prefCount===47&&playerWin)d.completeCount=(d.completeCount||0)+1;s.setItem("jintoriRecord",JSON.stringify(d));}
function setup(){initPrefs();loadRecord();
el("howtoBtn").onclick=()=>{const c=el("howtoCard");c.style.display=c.style.display==="none"?"block":"none"};
el("startBtn").onclick=()=>{state.selected=null;mapHtml("baseMap","base");el("baseConfirmBtn").disabled=true;el("baseMsg").textContent="";setScreen("base");};
el("backTitleBtn").onclick=()=>setScreen("title");
el("baseConfirmBtn").onclick=()=>{const p=getPref(state.selected);if(!p){el("baseMsg").textContent="都道府県を選んでください。";return;}p.owner="player";state.playerBase=p.id;const pool=state.prefs.filter(x=>x.id!==p.id);const enemy=pool[Math.floor(Math.random()*pool.length)];enemy.owner="enemy";state.enemyBase=enemy.id;state.turn=1;state.correct=0;state.wrong=0;state.logs=[];log(`プレイヤー本拠地: ${p.name}`);log(`敵AI本拠地: ${enemy.name}`);setScreen("game");renderGame();};
el("attackBtn").onclick=()=>{if(state.turn>state.maxTurn){log("ゲーム終了後は攻撃できません。");return;}const p=getPref(state.selected);if(!p){log("攻める県を選んでください。");return;}if(p.owner){log("その県はすでに獲得済みです。");return;}if(!playerAttackables().includes(p.id)){log("その県は隣接していないため攻撃できません。");return;}startQuiz();};
el("quizNextBtn").onclick=()=>nextTurn();
el("retryBtn").onclick=()=>{setup();setScreen("title");};}
setup();
</script>
