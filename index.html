const THEMES=[{id:'areaDesc',label:'面積が大きい順',key:'areaKm2',cmp:(a,b)=>b.areaKm2-a.areaKm2},{id:'areaAsc',label:'面積が小さい順',key:'areaKm2',cmp:(a,b)=>a.areaKm2-b.areaKm2},{id:'popDesc',label:'人口が多い順',key:'population',cmp:(a,b)=>b.population-a.population},{id:'popAsc',label:'人口が少ない順',key:'population',cmp:(a,b)=>a.population-b.population},{id:'densDesc',label:'人口密度が高い順',key:'density',cmp:(a,b)=>b.density-a.density},{id:'densAsc',label:'人口密度が低い順',key:'density',cmp:(a,b)=>a.density-b.density}];

let state={};
function drawMap(){const prefs=[...document.querySelectorAll('#japanMap .pref-shape')];prefs.forEach((pref)=>{pref.classList.remove('player','enemy','answer');pref.onclick=(e)=>{const el=e.currentTarget.closest('.pref-shape');if(el&&el.dataset.prefId)answer(el.dataset.prefId);};});}
function validateData(){const w=[];const ids=PREFS.map(p=>p.id);const VALID_DATA_SOURCES=['learning-simplified-map','mlit-n03-derived','gsi-derived','geolonia-gfdl'];if(PREFS.length!==47)w.push('PREFS 47件でない');if(new Set(ids).size!==47)w.push('id重複');if(!japanMap)w.push('#japanMap欠落');if(!japanMap.dataset.source)w.push('data-source欠落');if(!VALID_DATA_SOURCES.includes(japanMap.dataset.source))w.push('data-source不正');const prefEls=[...japanMap.querySelectorAll('.pref-shape')];if(prefEls.length!==47)w.push('.pref-shape が47件でない');const prefIds=prefEls.map(el=>el.dataset.prefId).filter(Boolean);if(prefIds.length!==47)w.push('data-pref-id が47件でない');if(prefIds.some(id=>!ids.includes(id)))w.push('data-pref-id と PREFS id が不一致');if(ids.some(id=>!prefIds.includes(id)))w.push('PREFS id が地図に不足');const emptyN=PREFS.filter(p=>!p.neighbors.length).length;if(emptyN>2)w.push('neighbors空が多すぎる');if(PREFS.some(p=>p.specialties.includes('郷土料理')))w.push('specialtiesダミー');if(PREFS.some(p=>p.landmarks.includes('名所')))w.push('landmarksダミー');if(w.length){if(japanMap.dataset.source!=='geolonia-gfdl'){warning.classList.remove('hidden');warning.textContent='現在の地図は学習用簡略版です。';}console.warn(w);}}
function safeGet(k,d='0'){try{return localStorage.getItem(k)||d;}catch{return d;}} function safeSet(k,v){try{localStorage.setItem(k,v);}catch{}}
function setup(){theme.innerHTML=THEMES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('');drawMap();validateData();best.textContent='ベスト: '+safeGet('wolf-best','0')+'点';}const MODE_LABEL={challenge10:'チャレンジ10',all:'全国制覇',kids:'キッズモード',gachi:'ガチモード'};
function startGame(){state={theme:THEMES.find(t=>t.id===theme.value),mode:mode.value,ranking:[],i:0,score:0,combo:0,correct:0,wrong:0,maxCombo:0,hintUsed:false,misses:[]};state.ranking=[...PREFS].sort(state.theme.cmp);state.limit=state.mode==='challenge10'?10:47;title.classList.add('hidden');game.classList.remove('hidden');updatePrompt();}
function updatePrompt(){next.textContent=`次は${state.i+1}位（${state.theme.label}）`;score.textContent=state.score+'点';combo.textContent='COMBO '+state.combo;stats.textContent=`正解${state.correct} 不正解${state.wrong} 残り${state.limit-state.i}`;}
function answer(id){const el=document.querySelector(`[data-pref-id="${id}"]`);if(!el)return;if(el.classList.contains('player')||el.classList.contains('enemy')||el.classList.contains('answer')){hintText.textContent='その県はもう選んだよ！';return;}const picked=PREFS.find(p=>p.id===id),target=state.ranking[state.i],rankPicked=state.ranking.findIndex(p=>p.id===id)+1,dist=Math.abs(rankPicked-(state.i+1));const ok=id===target.id,near=state.mode==='kids'&&dist<=2;let delta=ok?100:near?50:-30;if(state.hintUsed)delta-=20;state.score+=delta;el.classList.add(ok||near?'player':'enemy');if(!ok&&!near){document.querySelector(`[data-pref-id="${target.id}"]`).classList.add('answer');state.wrong++;state.misses.push(target.name);state.combo=0;}else{state.correct++;state.combo++;if(state.combo===3)state.score+=100;if(state.combo===5)state.score+=200;if(state.combo===10)state.score+=500;}state.maxCombo=Math.max(state.maxCombo,state.combo);const status=ok?'正解':near?'おしい':'不正解';explain.innerHTML=`<h3>${status}！</h3><p>正解県は <b>${target.name}</b>（${state.i+1}位）だよ。</p><p>きみが選んだのは <b>${picked.name}</b>（${rankPicked}位）。</p><p>このお題の値：正解 ${target[state.theme.key].toLocaleString()} / 選択 ${picked[state.theme.key].toLocaleString()}</p><p>学習メモ：県庁所在地 ${target.capital}、名産 ${target.specialties[0]}、名所 ${target.landmarks[0]}。</p>`;state.i++;state.hintUsed=false;if(state.i>=state.limit)return finish();updatePrompt();}
function showHint(){const t=state.ranking[state.i];hintText.textContent=`${t.region}・${t.capital}・値${t[state.theme.key].toLocaleString()}付近`;state.hintUsed=true;}
function finish(){if(state.mode==='all'&&state.correct===47)state.score+=1000;game.classList.add('hidden');result.classList.remove('hidden');const rate=Math.round(state.correct/state.limit*100);const misses=[...new Set(state.misses)].join('、')||'なし';result.innerHTML=`<h2>結果</h2><div class='score'>${state.score}点</div><p>お題: ${state.theme.label}</p><p>モード: ${MODE_LABEL[state.mode]||state.mode}</p><p>正解数 ${state.correct} / 不正解数 ${state.wrong}</p><p>正解率 ${rate}% / 最大コンボ ${state.maxCombo}</p><p>間違えた県: ${misses}</p><button onclick='shareResult()'>シェア</button><button onclick='location.reload()'>もう一度</button><button onclick='backToTitle()'>タイトルへ戻る</button>`;safeSet('wolf-best',String(Math.max(+safeGet('wolf-best','0'),state.score)));}function backToTitle(){result.classList.add('hidden');title.classList.remove('hidden');drawMap();warning.classList.add('hidden');hintText.textContent='';explain.textContent='';}
async function shareResult(){try{const text=`完璧な日本地図ウルフで${state.score}点`;if(navigator.share){await navigator.share({text});}else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('コピーしました');}}catch(e){console.warn('share failed',e);}}
startBtn.onclick=startGame;hintBtn.onclick=showHint;setup();
</script></body></html>
