<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ff3366" />
  <title>完璧な日本地図ウルフ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Reggae+One&display=swap" rel="stylesheet">
  <style>
    :root{
      --c-hero:#ff3366;--c-sun:#ffc93c;--c-deep:#3b5bdb;--c-ink:#1f0a3d;
      --c-ink-soft:#6b6483;--c-cream:#fff9f2;--c-paper:#fff;--c-line:#1f0a3d;
      --c-map:#eaf4ff;--sh-1:3px 3px 0 var(--c-line);--sh-2:5px 5px 0 var(--c-line);
      --r-md:14px;--r-lg:20px;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:"Zen Maru Gothic",sans-serif;background:radial-gradient(circle at 1px 1px,#ffd1de 1px,transparent 1px) 0 0/16px 16px,var(--c-cream);color:var(--c-ink);padding-bottom:env(safe-area-inset-bottom)}
    .container{max-width:1100px;margin:auto;padding:12px}
    .card{background:var(--c-paper);border:3px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:12px;margin-bottom:12px}
    .hero{background:var(--c-hero);color:#fff}
    .logo,.score,.combo{font-family:"Reggae One",cursive}
    h1,h2,h3,button,select{font-family:"M PLUS Rounded 1c",sans-serif}
    h1{margin:.15em 0;font-size:clamp(22px,5vw,36px)}
    h2{margin:.2em 0 .5em}
    .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
    .hidden{display:none!important}
    label{display:block;font-weight:800;margin:8px 0}
    select,button{width:100%;min-height:48px;border:3px solid var(--c-line);border-radius:var(--r-md);padding:8px 10px;background:var(--c-sun);color:var(--c-ink);box-shadow:var(--sh-1);font-size:16px;font-weight:800}
    button{cursor:pointer;touch-action:manipulation}
    button:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
    button:disabled{opacity:.55;cursor:wait}
    .hint-mini{font-size:13px;color:var(--c-ink-soft)}
    .score,.combo{font-size:clamp(28px,7vw,46px);line-height:1.15}
    #stats{font-weight:800;margin:8px 0}
    #explain{min-height:0}
    .map-card{padding:10px}
    .map-inner{position:relative;min-height:320px;background:var(--c-map);border:3px solid var(--c-line);border-radius:var(--r-lg);overflow:hidden}
    #mapMount{width:100%;min-height:320px;display:grid;place-items:center}
    #japanMap{display:block;width:100%;height:auto;max-height:72vh;background:var(--c-map);touch-action:manipulation}
    #japanMap .pref-shape{cursor:pointer;outline:none}
    #japanMap .pref-shape path{fill:var(--c-paper)!important;stroke:var(--c-line)!important;stroke-width:1!important;vector-effect:non-scaling-stroke;transition:fill .12s ease}
    #japanMap .pref-shape:hover path,#japanMap .pref-shape:focus path{fill:#ffe9a2!important}
    #japanMap .pref-shape.player path{fill:var(--c-sun)!important}
    #japanMap .pref-shape.enemy path{fill:var(--c-hero)!important}
    #japanMap .pref-shape.answer path{fill:var(--c-deep)!important}
    .map-status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(234,244,255,.92);font-weight:900;z-index:2}
    .map-status small{display:block;margin-top:8px;color:var(--c-ink-soft);font-weight:700}
    .source{font-size:11px;color:var(--c-ink-soft);line-height:1.55}
    .error{background:#fff1f3;color:#8b1736}
    @media(max-width:760px){
      .container{padding:8px}.card{padding:10px;margin-bottom:10px}.row{grid-template-columns:1fr}.hero{padding:12px}.map-card{padding:7px}.map-inner,#mapMount{min-height:300px}#japanMap{max-height:none}.score,.combo{font-size:32px}
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card hero">
      <div class="logo">完璧な日本地図ウルフ</div>
      <h1>都道府県ランキング学習陣取り</h1>
    </section>

    <section id="warning" class="card error hidden"></section>

    <section id="title" class="card">
      <label>お題<select id="theme"></select></label>
      <label>モード
        <select id="mode">
          <option value="challenge10">チャレンジ10</option>
          <option value="all">全国制覇</option>
          <option value="kids">キッズモード</option>
          <option value="gachi">ガチモード</option>
        </select>
      </label>
      <button id="startBtn" disabled>地図を読み込み中…</button>
      <div id="best" style="margin-top:10px;font-weight:800"></div>
    </section>

    <section id="game" class="hidden">
      <div class="card hint-mini">地図から、今のお題でその順位だと思う都道府県をタップ！</div>
      <div class="row">
        <section class="card">
          <h2 id="next"></h2>
          <div class="score" id="score"></div>
          <div class="combo" id="combo"></div>
          <div id="stats"></div>
          <button id="hintBtn">ヒント</button>
          <div id="hintText" style="margin-top:9px"></div>
        </section>
        <section class="card hidden" id="explain"></section>
      </div>
      <section class="card map-card">
        <div class="map-inner">
          <div id="mapMount" aria-live="polite"></div>
          <div id="mapStatus" class="map-status">
            <div>正確な都道府県地図を読み込み中…<small>国土数値情報 N03 から生成したSVGです</small></div>
          </div>
        </div>
      </section>
      <section class="card" id="log"></section>
    </section>

    <section id="result" class="card hidden"></section>

    <footer class="card source">
      地図データ：国土数値情報「行政区域データ（N03）」を加工して作成。<br>
      市区町村境界を都道府県単位に結合し、Web表示用に簡略化しています。
    </footer>
  </main>

<script>
'use strict';

const PREF_DATA=[
['01','hokkaido','北海道','北海道地方','札幌市',83424,5220000,63,'じゃがいも','札幌時計台'],

['12','chiba','千葉県','関東地方','千葉市',5157,6280000,1218,'落花生','成田山新勝寺'],
['13','tokyo','東京都','関東地方','新宿区',2194,14100000,6426,'もんじゃ焼き','東京タワー'],
['14','kanagawa','神奈川県','関東地方','横浜市',2416,9230000,3820,'しらす','横浜中華街'],
['15','niigata','新潟県','中部地方','新潟市',12584,2140000,170,'米','佐渡島'],
['16','toyama','富山県','中部地方','富山市',4248,1030000,242,'ます寿司','黒部ダム'],
['17','ishikawa','石川県','中部地方','金沢市',4186,1140000,272,'加賀野菜','兼六園'],
['18','fukui','福井県','中部地方','福井市',4190,750000,179,'越前ガニ','東尋坊'],
['19','yamanashi','山梨県','中部地方','甲府市',4465,810000,181,'ぶどう','富士山'],
['20','nagano','長野県','中部地方','長野市',13562,2000000,147,'そば','上高地'],
['21','gifu','岐阜県','中部地方','岐阜市',10621,1970000,185,'飛騨牛','白川郷'],
['22','shizuoka','静岡県','中部地方','静岡市',7777,3560000,458,'お茶','三保松原'],
['23','aichi','愛知県','中部地方','名古屋市',5173,7520000,1454,'味噌カツ','名古屋城'],
['24','mie','三重県','近畿地方','津市',5774,1740000,302,'伊勢うどん','伊勢神宮'],
['25','shiga','滋賀県','近畿地方','大津市',4017,1410000,351,'鮒ずし','琵琶湖'],
['26','kyoto','京都府','近畿地方','京都市',4613,2550000,553,'京野菜','清水寺'],
['27','osaka','大阪府','近畿地方','大阪市',1905,8770000,4600,'たこ焼き','大阪城'],
['28','hyogo','兵庫県','近畿地方','神戸市',8401,5460000,650,'明石焼き','姫路城'],
['29','nara','奈良県','近畿地方','奈良市',3691,1310000,355,'柿の葉寿司','東大寺'],
['30','wakayama','和歌山県','近畿地方','和歌山市',4725,910000,193,'梅干し','高野山'],
['31','tottori','鳥取県','中国地方','鳥取市',3507,540000,154,'二十世紀梨','鳥取砂丘'],
['32','shimane','島根県','中国地方','松江市',6708,650000,97,'しじみ','出雲大社'],
['33','okayama','岡山県','中国地方','岡山市',7114,1880000,264,'きびだんご','後楽園'],
['34','hiroshima','広島県','中国地方','広島市',8479,2760000,325,'お好み焼き','厳島神社'],
['35','yamaguchi','山口県','中国地方','山口市',6113,1320000,216,'ふぐ','錦帯橋'],
['36','tokushima','徳島県','四国地方','徳島市',4146,700000,169,'すだち','鳴門の渦潮'],
['37','kagawa','香川県','四国地方','高松市',1877,950000,506,'讃岐うどん','金刀比羅宮'],
['38','ehime','愛媛県','四国地方','松山市',5676,1320000,233,'みかん','道後温泉'],
['39','kochi','高知県','四国地方','高知市',7104,670000,94,'かつお','桂浜'],
['40','fukuoka','福岡県','九州地方','福岡市',4987,5110000,1025,'明太子','太宰府天満宮'],
['41','saga','佐賀県','九州地方','佐賀市',2440,800000,328,'有田焼','吉野ヶ里遺跡'],
['42','nagasaki','長崎県','九州地方','長崎市',4131,1290000,312,'ちゃんぽん','ハウステンボス'],
['43','kumamoto','熊本県','九州地方','熊本市',7409,1720000,232,'馬刺し','熊本城'],
['44','oita','大分県','九州地方','大分市',6341,1110000,175,'とり天','別府温泉'],
['45','miyazaki','宮崎県','九州地方','宮崎市',7735,1060000,137,'チキン南蛮','高千穂峡'],
['46','kagoshima','鹿児島県','九州地方','鹿児島市',9187,1560000,170,'黒豚','桜島'],
['47','okinawa','沖縄県','九州地方','那覇市',2282,1470000,644,'ゴーヤー','首里城']
];

const PREFS=PREF_DATA.map(([code,id,name,region,capital,areaKm2,population,density,specialty,landmark])=>({code,id,name,region,capital,areaKm2,population,density,specialty,landmark}));
const CODE_TO_ID=new Map(PREFS.map(p=>[p.code,p.id]));
const THEMES=[
  {id:'areaDesc',label:'面積が大きい順',key:'areaKm2',cmp:(a,b)=>b.areaKm2-a.areaKm2},
  {id:'areaAsc',label:'面積が小さい順',key:'areaKm2',cmp:(a,b)=>a.areaKm2-b.areaKm2},
  {id:'popDesc',label:'人口が多い順',key:'population',cmp:(a,b)=>b.population-a.population},
  {id:'popAsc',label:'人口が少ない順',key:'population',cmp:(a,b)=>a.population-b.population},
  {id:'densDesc',label:'人口密度が高い順',key:'density',cmp:(a,b)=>b.density-a.density},
  {id:'densAsc',label:'人口密度が低い順',key:'density',cmp:(a,b)=>a.density-b.density}
];
const MODE_LABEL={challenge10:'チャレンジ10',all:'全国制覇',kids:'キッズモード',gachi:'ガチモード'};

const $=id=>document.getElementById(id);
const theme=$('theme'),mode=$('mode'),startBtn=$('startBtn'),best=$('best'),title=$('title'),game=$('game'),next=$('next'),score=$('score'),combo=$('combo'),stats=$('stats'),hintBtn=$('hintBtn'),hintText=$('hintText'),explain=$('explain'),result=$('result'),warning=$('warning'),mapMount=$('mapMount'),mapStatus=$('mapStatus');
let state={};
let mapReady=false;

function safeGet(k,d='0'){try{return localStorage.getItem(k)||d}catch{return d}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch{}}

async function loadMap(){
  mapReady=false;
  startBtn.disabled=true;
  startBtn.textContent='地図を読み込み中…';
  mapStatus.classList.remove('hidden');
  warning.classList.add('hidden');
  try{
    const response=await fetch('./public/map-full.svg?v=20260903-n03-1',{cache:'no-cache'});
    if(!response.ok)throw new Error(`地図ファイルを取得できませんでした (${response.status})`);
    const text=await response.text();
    const xml=new DOMParser().parseFromString(text,'image/svg+xml');
    if(xml.querySelector('parsererror'))throw new Error('SVGの解析に失敗しました');
    const sourceSvg=xml.documentElement;
    const prefGroups=[...sourceSvg.querySelectorAll('.prefecture')];
    if(prefGroups.length!==47)throw new Error(`都道府県が47件ではありません (${prefGroups.length})`);

    sourceSvg.id='japanMap';
    sourceSvg.dataset.source='mlit-n03-derived';
    sourceSvg.setAttribute('aria-label','国土数値情報から作成した日本の都道府県地図');
    sourceSvg.removeAttribute('width');
    sourceSvg.removeAttribute('height');

    for(const group of prefGroups){
      const code=String(group.dataset.code||'').padStart(2,'0');
      const prefId=CODE_TO_ID.get(code);
      if(!prefId)throw new Error(`都道府県コード ${code} をゲームデータへ対応付けできません`);
      group.classList.add('pref-shape');
      group.dataset.prefId=prefId;
      group.setAttribute('role','button');
      group.setAttribute('tabindex','0');
    }

    const imported=document.importNode(sourceSvg,true);
    mapMount.replaceChildren(imported);
    drawMap();
    validateMap();
    mapReady=true;
    mapStatus.classList.add('hidden');
    startBtn.disabled=false;
    startBtn.textContent='スタート';
  }catch(error){
    console.error(error);
    mapStatus.innerHTML=`<div>地図の読み込みに失敗しました。<small>${escapeHtml(error.message)}</small><button type="button" id="retryMap" style="margin-top:12px">もう一度読み込む</button></div>`;
    warning.classList.remove('hidden');
    warning.textContent='正確な地図を読み込めていないため、ゲームは開始できません。';
    const retry=$('retryMap');
    if(retry)retry.onclick=()=>{mapStatus.innerHTML='<div>正確な都道府県地図を読み込み中…<small>国土数値情報 N03 から生成したSVGです</small></div>';loadMap()};
  }
}

function validateMap(){
  const svg=$('japanMap');
  if(!svg)throw new Error('#japanMap がありません');
  const groups=[...svg.querySelectorAll('.pref-shape')];
  if(groups.length!==47)throw new Error(`地図要素が47件ではありません (${groups.length})`);
  const ids=new Set(groups.map(g=>g.dataset.prefId));
  if(PREFS.some(p=>!ids.has(p.id)))throw new Error('ゲームデータと地図の都道府県IDが一致しません');
}

function drawMap(){
  const svg=$('japanMap');
  if(!svg)return;
  svg.querySelectorAll('.pref-shape').forEach(pref=>{
    pref.classList.remove('player','enemy','answer');
    pref.onclick=event=>{
      const el=event.currentTarget;
      if(el.dataset.prefId)answer(el.dataset.prefId);
    };
    pref.onkeydown=event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();const el=event.currentTarget;if(el.dataset.prefId)answer(el.dataset.prefId)}
    };
  });
}

function setup(){
  theme.innerHTML=THEMES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('');
  best.textContent='ベスト: '+safeGet('wolf-best','0')+'点';
  loadMap();
}

function startGame(){
  if(!mapReady){warning.classList.remove('hidden');warning.textContent='地図を読み込み中です。少し待ってから開始してください。';return}
  state={theme:THEMES.find(t=>t.id===theme.value),mode:mode.value,ranking:[],i:0,score:0,combo:0,correct:0,wrong:0,maxCombo:0,hintUsed:false,misses:[]};
  state.ranking=[...PREFS].sort(state.theme.cmp);
  state.limit=state.mode==='challenge10'?10:47;
  title.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');warning.classList.add('hidden');explain.classList.add('hidden');explain.innerHTML='';hintText.textContent='';drawMap();updatePrompt();
  requestAnimationFrame(()=>game.scrollIntoView({behavior:'smooth',block:'start'}));
}

function updatePrompt(){
  next.textContent=`次は${state.i+1}位（${state.theme.label}）`;
  score.textContent=state.score+'点';combo.textContent='COMBO '+state.combo;
  stats.textContent=`正解${state.correct} 不正解${state.wrong} 残り${state.limit-state.i}`;
}

function answer(id){
  if(!state.ranking||state.i>=state.limit)return;
  const el=document.querySelector(`[data-pref-id="${id}"]`);
  if(!el)return;
  if(el.classList.contains('player')||el.classList.contains('enemy')||el.classList.contains('answer')){hintText.textContent='その県はもう選んだよ！';return}
  const picked=PREFS.find(p=>p.id===id),target=state.ranking[state.i];
  const rankPicked=state.ranking.findIndex(p=>p.id===id)+1;
  const dist=Math.abs(rankPicked-(state.i+1));
  const ok=id===target.id,near=state.mode==='kids'&&dist<=2;
  let delta=ok?100:near?50:-30;
  if(state.hintUsed)delta-=20;
  state.score+=delta;
  el.classList.add(ok||near?'player':'enemy');
  if(!ok&&!near){
    const answerEl=document.querySelector(`[data-pref-id="${target.id}"]`);
    if(answerEl)answerEl.classList.add('answer');
    state.wrong++;state.misses.push(target.name);state.combo=0;
  }else{
    state.correct++;state.combo++;
    if(state.combo===3)state.score+=100;if(state.combo===5)state.score+=200;if(state.combo===10)state.score+=500;
  }
  state.maxCombo=Math.max(state.maxCombo,state.combo);
  const status=ok?'正解':near?'おしい':'不正解';
  explain.classList.remove('hidden');
  explain.innerHTML=`<h3>${status}！</h3><p>正解県は <b>${target.name}</b>（${state.i+1}位）。</p><p>選んだ県は <b>${picked.name}</b>（${rankPicked}位）。</p><p>値：正解 ${target[state.theme.key].toLocaleString()} / 選択 ${picked[state.theme.key].toLocaleString()}</p><p>県庁所在地：${target.capital}<br>名産：${target.specialty}<br>名所：${target.landmark}</p>`;
  state.i++;state.hintUsed=false;
  if(state.i>=state.limit){finish();return}
  updatePrompt();
}

function showHint(){
  if(!state.ranking)return;
  const t=state.ranking[state.i];
  hintText.textContent=`${t.region}・県庁所在地 ${t.capital}・値 ${t[state.theme.key].toLocaleString()} 付近`;
  state.hintUsed=true;
}

function finish(){
  if(state.mode==='all'&&state.correct===47)state.score+=1000;
  game.classList.add('hidden');result.classList.remove('hidden');
  const rate=Math.round(state.correct/state.limit*100),misses=[...new Set(state.misses)].join('、')||'なし';
  result.innerHTML=`<h2>結果</h2><div class="score">${state.score}点</div><p>お題：${state.theme.label}</p><p>モード：${MODE_LABEL[state.mode]||state.mode}</p><p>正解数 ${state.correct} / 不正解数 ${state.wrong}</p><p>正解率 ${rate}% / 最大コンボ ${state.maxCombo}</p><p>間違えた県：${misses}</p><button type="button" id="shareBtn">シェア</button><button type="button" id="againBtn" style="margin-top:8px">もう一度</button><button type="button" id="backBtn" style="margin-top:8px">タイトルへ戻る</button>`;
  safeSet('wolf-best',String(Math.max(+safeGet('wolf-best','0'),state.score)));
  $('shareBtn').onclick=shareResult;$('againBtn').onclick=startGame;$('backBtn').onclick=backToTitle;
  result.scrollIntoView({behavior:'smooth',block:'start'});
}

function backToTitle(){result.classList.add('hidden');game.classList.add('hidden');title.classList.remove('hidden');drawMap();warning.classList.add('hidden');hintText.textContent='';explain.textContent='';explain.classList.add('hidden');best.textContent='ベスト: '+safeGet('wolf-best','0')+'点';window.scrollTo({top:0,behavior:'smooth'})}

async function shareResult(){
  const text=`完璧な日本地図ウルフで${state.score}点！`;
  try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('コピーしました')}}catch(error){console.warn('share failed',error)}
}

function escapeHtml(value){return String(value).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

startBtn.onclick=startGame;
hintBtn.onclick=showHint;
setup();
</script>
</body>
</html>
