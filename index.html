<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ランキング学習型 都道府県陣取り</title>
<style>body{font-family:sans-serif;margin:0;padding:16px;background:#f8fafc} .card{background:#fff;border:2px solid #222;border-radius:12px;padding:12px;margin-bottom:12px} select,button{padding:8px 10px;margin:4px} .hidden{display:none} #mapContainer svg{width:100%;max-width:960px;height:auto} .ok{color:#0a7} .ng{color:#c22}</style>
</head>
<body>
<div class="card">
<h1>都道府県ランキング学習ゲーム</h1>
<p>最優先仕様: 「完璧な日本地図ウルフ」ベースのみで実行します。</p>
</div>
<div id="missingReport" class="card hidden"></div>
<div id="gameRoot" class="hidden">
  <div class="card">
    <label>お題: <select id="theme"></select></label>
    <button id="start">開始</button>
    <div id="status"></div>
  </div>
  <div class="card" id="mapContainer"></div>
</div>
<script>
const CANDIDATE_MAP_FILES=[
  'kanpeki-nihonchizu-wolf.svg','perfect-japan-map-wolf.svg','japan-map-wolf.svg','perfect-japan-map.svg','prefectures.svg','japan.svg'
];
const PREFS=[
{name:'北海道',areaKm2:83424,population:5224614,density:63,capital:'札幌市',region:'北海道地方',specialties:['じゃがいも'],landmarks:['富良野']},
{name:'青森県',areaKm2:9646,population:1203515,density:125,capital:'青森市',region:'東北地方',specialties:['りんご'],landmarks:['奥入瀬渓流']},
{name:'岩手県',areaKm2:15275,population:1170000,density:77,capital:'盛岡市',region:'東北地方',specialties:['わんこそば'],landmarks:['平泉']},
{name:'宮城県',areaKm2:7282,population:2270000,density:312,capital:'仙台市',region:'東北地方',specialties:['牛たん'],landmarks:['松島']},
{name:'秋田県',areaKm2:11638,population:920000,density:79,capital:'秋田市',region:'東北地方',specialties:['きりたんぽ'],landmarks:['田沢湖']},
{name:'山形県',areaKm2:9323,population:1030000,density:110,capital:'山形市',region:'東北地方',specialties:['さくらんぼ'],landmarks:['蔵王']},
{name:'福島県',areaKm2:13784,population:1760000,density:128,capital:'福島市',region:'東北地方',specialties:['桃'],landmarks:['磐梯山']},
{name:'東京都',areaKm2:2194,population:14100000,density:6400,capital:'新宿区',region:'関東地方',specialties:['もんじゃ'],landmarks:['東京タワー']},
{name:'大阪府',areaKm2:1905,population:8770000,density:4600,capital:'大阪市',region:'近畿地方',specialties:['たこ焼き'],landmarks:['大阪城']},
{name:'沖縄県',areaKm2:2282,population:1470000,density:644,capital:'那覇市',region:'九州地方',specialties:['ゴーヤー'],landmarks:['首里城']}
];
const THEMES=[
{id:'areaDesc',label:'面積が大きい順',cmp:(a,b)=>b.areaKm2-a.areaKm2},
{id:'areaAsc',label:'面積が小さい順',cmp:(a,b)=>a.areaKm2-b.areaKm2},
{id:'popDesc',label:'人口が多い順',cmp:(a,b)=>b.population-a.population},
{id:'popAsc',label:'人口が少ない順',cmp:(a,b)=>a.population-b.population},
{id:'densDesc',label:'人口密度が高い順',cmp:(a,b)=>b.density-a.density},
{id:'densAsc',label:'人口密度が低い順',cmp:(a,b)=>a.density-b.density}
];
async function findWolfMap(){
  for(const f of CANDIDATE_MAP_FILES){
    try{const r=await fetch(f,{method:'HEAD'});if(r.ok)return f;}catch{}
  }
  return null;
}
function renderMissingReport(){
  const el=document.getElementById('missingReport');
  el.classList.remove('hidden');
  el.innerHTML=`<h2>「完璧な日本地図ウルフ」未検出</h2>
  <ul>
  <li>探したファイル名: ${CANDIDATE_MAP_FILES.join(', ')}</li>
  <li>探した場所: 現在のWebルート（同一ディレクトリ）</li>
  <li>見つからなかった理由: 実ファイルが存在しない/配信されていない</li>
  <li>必要データ形式: 47都道府県が個別要素（id/name付き）になったSVG（path/polygon）</li>
  <li>実装方法: SVG各都道府県要素にクリックイベントを付与し、ランキング正誤判定で色分けする</li>
  </ul>`;
}
function bootGame(mapFile){
  document.getElementById('gameRoot').classList.remove('hidden');
  document.getElementById('mapContainer').innerHTML=`<object data="${mapFile}" type="image/svg+xml"></object>`;
  const themeSel=document.getElementById('theme');
  themeSel.innerHTML=THEMES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('');
  let ranking=[],idx=0;
  document.getElementById('start').onclick=()=>{
    const t=THEMES.find(x=>x.id===themeSel.value);
    ranking=[...PREFS].sort(t.cmp); idx=0;
    document.getElementById('status').textContent=`お題: ${t.label} / 次は ${idx+1}位`;
  };
}
(async()=>{const map=await findWolfMap(); if(!map){renderMissingReport(); return;} bootGame(map);})();
</script>
</body></html>
