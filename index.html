<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>都道府県陣取りバトル MVP+</title>
  <style>
    :root {
      --bg1:#a7e8ff;--bg2:#fef7c3;--card:#fff;--text:#1f2937;--muted:#6b7280;
      --neutral:#b9c0ca;--player:#3b82f6;--enemy:#ef4444;--attack:#facc15;
      --selected:#111827;--ok:#16a34a;--ng:#dc2626;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh}
    .app{max-width:1220px;margin:0 auto;padding:16px}
    .screen{display:none;animation:fadeIn .25s ease}.screen.active{display:block}
    @keyframes fadeIn{from{opacity:.2}to{opacity:1}}
    .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.1);margin-bottom:14px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .btn{border:none;border-radius:12px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer;min-height:50px}
    .btn:disabled{opacity:.45;cursor:not-allowed}.btn-main{background:#22c55e;color:#fff}.btn-sub{background:#e5e7eb;color:#111}.btn-aux{background:#fde68a;color:#111}
    .guide{font-size:18px;font-weight:800;color:#0f766e;margin:6px 0}
    .next-step{font-size:21px;font-weight:900;background:#ecfeff;border:3px solid #06b6d4;border-radius:12px;padding:10px 12px;margin-bottom:10px}

    .legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px}.chip{padding:4px 8px;border-radius:999px;border:2px solid #111;font-weight:700}
    .chip.neutral{background:var(--neutral)}.chip.player{background:var(--player);color:#fff}.chip.enemy{background:var(--enemy);color:#fff}
    .chip.attack{background:#fff7a8;border-color:var(--attack)}.chip.selected{background:#fff;border-width:4px}

    .map-wrap{overflow-x:auto;padding:8px;border:2px dashed #94a3b8;border-radius:12px;background:linear-gradient(145deg,#f8fafc,#eff6ff)}
    .map-grid{display:grid;grid-template-columns:repeat(20,58px);grid-template-rows:repeat(18,56px);gap:7px;min-width:1220px;transform:rotate(-8deg);transform-origin:center center}
    .pref{min-height:52px;min-width:54px;border-radius:10px;border:2px solid #475569;color:#111;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s,filter .12s;background:var(--neutral);line-height:1.15;white-space:pre-line}
    .pref:hover{transform:translateY(-2px)}.pref.player{background:var(--player);color:#fff}.pref.enemy{background:var(--enemy);color:#fff}
    .pref.attackable{box-shadow:0 0 0 3px var(--attack) inset,0 0 15px 2px rgba(250,204,21,.85);animation:glow 1.3s ease-in-out infinite}
    @keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
    .pref.selected{outline:5px solid #000;border-color:#000}.pref.flash{animation:flash .6s ease 2}
    @keyframes flash{0%{transform:scale(1)}50%{transform:scale(1.08);filter:brightness(1.6)}100%{transform:scale(1)}}

    .stats{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:8px}.stat{background:#f3f4f6;border-radius:10px;padding:8px;font-weight:700;text-align:center}
    .log{max-height:230px;overflow:auto;background:#0b1220;color:#e5e7eb;padding:10px;border-radius:10px;font-size:14px}.log p{margin:0 0 6px}

    .quiz-options{display:grid;gap:8px}.quiz-btn{background:#e0f2fe;border:2px solid #0ea5e9}.quiz-btn.correct{background:#bbf7d0;border-color:var(--ok)}.quiz-btn.wrong{background:#fecaca;border-color:var(--ng)}
    .shake{animation:shake .35s linear}@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}

    @media (max-width:720px){.app{padding:10px}.btn{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.map-grid{grid-template-columns:repeat(20,56px)}}
  </style>
</head>
<body>
<div class="app">
  <section id="titleScreen" class="screen active"><div class="card"><h1>🗾 都道府県陣取りバトル</h1><p>クイズで県を取ろう！敵AIより多く取ったら勝ちです。</p><p class="guide">ゲーム用航路: 北海道⇄青森 / 沖縄⇄鹿児島</p><div class="row"><button id="startBtn" class="btn btn-main">はじめる</button><button id="howtoBtn" class="btn btn-sub">遊び方</button></div></div><div id="howtoCard" class="card" style="display:none;"><h3>遊び方</h3><ol><li>本拠地を1つ選ぶ</li><li>光っている県を選んで攻める</li><li>クイズ正解で県を取れる</li><li>30ターンまたは決着で終了</li></ol></div><div id="recordCard" class="card"></div></section>
  <section id="baseScreen" class="screen"><div class="card"><h2>本拠地を選択</h2><p class="guide">都道府県を1つ選んで「決定」を押してください。</p><div class="map-wrap"><div id="baseMap" class="map-grid"></div></div><div class="row"><button id="baseConfirmBtn" class="btn btn-main" disabled>決定</button><button id="backTitleBtn" class="btn btn-sub">タイトルへ戻る</button></div><p id="baseMsg"></p></div></section>
  <section id="gameScreen" class="screen"><div class="card"><h2>メインゲーム</h2><p id="nextStep" class="next-step"></p><p id="actionGuide" class="guide"></p><div class="stats"><div class="stat" id="turnStat"></div><div class="stat" id="playerStat"></div><div class="stat" id="enemyStat"></div><div class="stat" id="remainStat"></div><div class="stat" id="accStat"></div><div class="stat" id="scoreStat"></div></div><div class="legend"><span class="chip neutral">未獲得</span><span class="chip player">プレイヤー</span><span class="chip enemy">敵AI</span><span class="chip attack">攻撃可能</span><span class="chip selected">選択中</span></div><div class="map-wrap"><div id="gameMap" class="map-grid"></div></div><p id="selectedInfo">選択中: なし</p><div class="row"><button id="attackBtn" class="btn btn-main" disabled>この県を攻める</button><button id="expeditionBtn" class="btn btn-aux" style="display:none;">遠征する</button></div></div><div class="card"><h3>ゲームログ</h3><div id="gameLog" class="log"></div></div></section>
  <section id="quizScreen" class="screen"><div id="quizCard" class="card"><h2>クイズバトル</h2><p id="quizQ"></p><div id="quizOptions" class="quiz-options"></div><p id="quizResult"></p><p id="quizExp"></p><button id="quizNextBtn" class="btn btn-main" style="display:none;">次へ</button></div></section>
  <section id="resultScreen" class="screen"><div class="card"><h2>結果発表</h2><h3 id="resultTitle"></h3><p id="resultSummary"></p><div id="finalStats"></div><div class="row"><button id="retryBtn" class="btn btn-main">もう一度遊ぶ</button></div></div></section>
</div>
<script>
const PREFS=[/* same data */

州地方","福岡市",["saga","oita","kumamoto","yamaguchi"],["明太子","とんこつラーメン"],["太宰府天満宮","博多"]],["saga","佐賀県","九州地方","佐賀市",["fukuoka","nagasaki"],["佐賀牛","いか"],["吉野ヶ里遺跡","有田"]],["nagasaki","長崎県","九州地方","長崎市",["saga","kumamoto"],["カステラ","ちゃんぽん"],["ハウステンボス","軍艦島"]],["kumamoto","熊本県","九州地方","熊本市",["fukuoka","oita","miyazaki","kagoshima","nagasaki"],["馬刺し","からし蓮根"],["熊本城","阿蘇山"]],["oita","大分県","九州地方","大分市",["fukuoka","kumamoto","miyazaki","ehime","yamaguchi"],["とり天","しいたけ"],["別府温泉","湯布院"]],["miyazaki","宮崎県","九州地方","宮崎市",["oita","kumamoto","kagoshima"],["マンゴー","チキン南蛮"],["高千穂峡","青島"]],["kagoshima","鹿児島県","九州地方","鹿児島市",["kumamoto","miyazaki","okinawa"],["黒豚","さつま揚げ"],["桜島","屋久島"]],["okinawa","沖縄県","九州地方","那覇市",["kagoshima"],["ゴーヤ","ちんすこう"],["首里城","美ら海水族館"]]

const POS={hokkaido:[16,1],aomori:[15,3],akita:[14,4],iwate:[16,4],yamagata:[14,5],miyagi:[16,5],fukushima:[15,6],niigata:[12,7],toyama:[11,8],ishikawa:[10,8],fukui:[9,9],nagano:[12,8],gifu:[11,9],yamanashi:[13,8],shizuoka:[13,9],aichi:[12,10],mie:[11,10],shiga:[10,10],kyoto:[9,10],osaka:[9,11],hyogo:[8,10],nara:[10,11],wakayama:[10,12],tottori:[7,10],shimane:[6,10],okayama:[7,11],hiroshima:[6,11],yamaguchi:[6,12],ibaraki:[16,7],tochigi:[15,7],gunma:[14,7],saitama:[15,8],chiba:[16,8],tokyo:[15,9],kanagawa:[15,10],tokushima:[8,12],kagawa:[7,12],ehime:[6,13],kochi:[7,13],fukuoka:[7,14],saga:[6,14],nagasaki:[5,14],kumamoto:[7,15],oita:[8,15],miyazaki:[8,16],kagoshima:[7,16],okinawa:[3,17]};
const state={screen:"title",prefs:[],turn:1,maxTurn:30,selected:null,playerBase:null,enemyBase:null,quiz:null,canAnswer:true,correct:0,wrong:0,logs:[],score:0,conqueredRegions:new Set(),storageOk:true,pendingAttackType:"neutral",gameOverReason:""};
const el=id=>document.getElementById(id);
function initPrefs(){state.prefs=PREFS.map(p=>({id:p[0],name:p[1],region:p[2],capital:p[3],neighbors:p[4],specialties:p[5],landmarks:p[6],owner:null}));}
function setScreen(s){["title","base","game","quiz","result"].forEach(k=>el(k+"Screen").classList.toggle("active",k===s));state.screen=s;}
function getPref(id){return state.prefs.find(p=>p.id===id)||null;} function countOwner(owner){return state.prefs.filter(p=>p.owner===owner).length;} function neutralPrefs(){return state.prefs.filter(p=>!p.owner);}
function attackablesFor(owner){const own=state.prefs.filter(p=>p.owner===owner);const set=new Set();own.forEach(p=>p.neighbors.forEach(n=>{const t=getPref(n);if(t&&t.owner!==owner)set.add(t.id);}));return [...set];}
function playerAttackables(){return attackablesFor("player");}
function log(msg){state.logs.unshift(`T${state.turn}: ${msg}`);el("gameLog").innerHTML=state.logs.slice(0,100).map(v=>`<p>${v}</p>`).join("");}
function prefShortName(name){return name.replace("都","").replace("府","").replace("県","").replace("北海道","北海道");}
function mapHtml(containerId,mode){const c=el(containerId);c.innerHTML="";const at=mode==="game"?playerAttackables():[];state.prefs.forEach(p=>{const b=document.createElement("button");b.className="pref";if(p.owner==="player")b.classList.add("player");if(p.owner==="enemy")b.classList.add("enemy");if(state.selected===p.id)b.classList.add("selected");if(mode==="game"&&at.includes(p.id))b.classList.add("attackable");b.style.gridColumn=(POS[p.id]?.[0]||1)+"";b.style.gridRow=(POS[p.id]?.[1]||1)+"";b.textContent=prefShortName(p.name);b.title=p.name;b.onclick=()=>onSelectPref(p.id,mode);c.appendChild(b);});}
function reasonCannotAttack(p){if(!p)return"県を選んでください";if(state.screen!=="game")return"";const at=playerAttackables();if(at.includes(p.id))return"攻撃可能";if(p.owner==="player")return"自分の県です";if(!state.prefs.some(x=>x.owner==="player"))return"プレイヤーの県がありません";return"自分の県に接していません";}
function onSelectPref(id,mode){const p=getPref(id);if(!p)return;state.selected=id;if(mode==="base"){el("baseConfirmBtn").disabled=false;el("baseMsg").textContent=`選択中: ${p.name}`;mapHtml("baseMap","base");return;}if(state.screen!=="game")return;const neighbors=p.neighbors.map(n=>getPref(n)?.name).filter(Boolean);const reason=reasonCannotAttack(p);el("selectedInfo").innerHTML=`選択中: ${p.name}<br>地方: ${p.region}<br>県庁所在地: ${p.capital}<br>所有者: ${p.owner==="player"?"プレイヤー":p.owner==="enemy"?"敵AI":"未獲得"}<br>隣接: ${neighbors.join("、")||"なし"}<br>状態: ${reason}`;const can=reason==="攻撃可能";el("attackBtn").disabled=!can; if(!can)log(`${p.name}は攻められません（${reason}）`); mapHtml("gameMap","game");}
function checkRegionBonus(){const regions=[...new Set(state.prefs.map(p=>p.region))];regions.forEach(r=>{if(state.conqueredRegions.has(r))return;const list=state.prefs.filter(p=>p.region===r);if(list.length&&list.every(p=>p.owner==="player")){state.conqueredRegions.add(r);state.score+=500;log(`🎉 ${r}を制覇！ +500点`);}});}
function updateGuide(){const at=playerAttackables();el("actionGuide").textContent="攻められる県を選んでください。黄色に光る県が目印です。";el("nextStep").textContent=at.length?"次: 光っている県をえらんで「この県を攻める」":"次: 攻め先がないので「遠征する」で未獲得県へ行こう";el("expeditionBtn").style.display=at.length?"none":"inline-block";}
function renderGame(){const total=countOwner("player")+countOwner("enemy"),answered=state.correct+state.wrong,acc=answered?Math.round(state.correct/answered*100):0;el("turnStat").textContent=`ターン: ${state.turn}`;el("playerStat").textContent=`プレイヤー: ${countOwner("player")}県`;el("enemyStat").textContent=`敵AI: ${countOwner("enemy")}県`;el("remainStat").textContent=`残りターン: ${Math.max(0,state.maxTurn-state.turn+1)}`;el("accStat").textContent=`正解率: ${acc}%`;el("scoreStat").textContent=`スコア: ${state.score}`;mapHtml("gameMap","game");el("selectedInfo").textContent="選択中: なし";el("attackBtn").disabled=true;updateGuide();const reason=getFinishReason();if(reason){state.gameOverReason=reason;finishGame();}}
function getFinishReason(){if(state.turn>state.maxTurn)return"30ターン終了";if(countOwner("player")===0)return"プレイヤー陣地がなくなりました";if(countOwner("enemy")===0)return"敵AIを全滅させました";if(countOwner("player")+countOwner("enemy")===47)return"全国が埋まりました";return"";}
function buildQuiz(pref){const cats=["capital","region","specialty","landmark","neighbor"];const type=cats[Math.floor(Math.random()*cats.length)];let q="",a="",pool=[];if(type==="capital"){q=`${pref.name}の県庁所在地はどこ？`;a=pref.capital;pool=state.prefs.map(p=>p.capital);}else if(type==="region"){q=`${pref.name}が属する地方は？`;a=pref.region;pool=[...new Set(state.prefs.map(p=>p.region))];}else if(type==="specialty"){q=`${pref.name}の名産品はどれ？`;a=pref.specialties[0];pool=state.prefs.flatMap(p=>p.specialties);}else if(type==="landmark"){q=`${pref.name}の観光地はどれ？`;a=pref.landmarks[0];pool=state.prefs.flatMap(p=>p.landmarks);}else{q=`${pref.name}に隣接している都道府県はどれ？`;a=getPref(pref.neighbors[0])?.name||"隣接県なし";pool=state.prefs.map(p=>p.name);}pool=[...new Set(pool.filter(x=>x&&x!==a))];const wrong=pool.sort(()=>Math.random()-.5).slice(0,3);const opts=[a,...wrong].sort(()=>Math.random()-.5);return {q,a,opts,exp:`正解は「${a}」。${pref.name}のポイントを覚えよう！`};}
function startQuiz(){const p=getPref(state.selected);if(!p)return;state.quiz=buildQuiz(p);state.canAnswer=true;el("quizQ").textContent=state.quiz.q;el("quizResult").textContent="";el("quizExp").textContent="";el("quizNextBtn").style.display="none";const box=el("quizOptions");box.innerHTML="";state.quiz.opts.forEach(opt=>{const b=document.createElement("button");b.className="btn quiz-btn";b.textContent=opt;b.onclick=()=>answerQuiz(opt,b);box.appendChild(b);});setScreen("quiz");}
function answerQuiz(ans,btn){if(!state.canAnswer)return;state.canAnswer=false;const target=getPref(state.selected),buttons=[...el("quizOptions").querySelectorAll("button")];buttons.forEach(b=>b.disabled=true);const ok=ans===state.quiz.a;if(ok){state.correct++;state.score+=50;const wasEnemy=target.owner==="enemy";target.owner="player";state.score+=wasEnemy?150:100;btn.classList.add("correct");el("quizResult").textContent=`✅ 正解！${target.name}をゲット！`;log(`プレイヤーが${target.name}を獲得！ +${wasEnemy?200:150}点`);checkRegionBonus();setTimeout(()=>{mapHtml("gameMap","game");},0);}else{state.wrong++;state.score-=20;btn.classList.add("wrong");el("quizCard").classList.add("shake");setTimeout(()=>el("quizCard").classList.remove("shake"),380);el("quizResult").textContent=`❌ ざんねん！正解は${state.quiz.a}でした`;log(`プレイヤーの${target.name}攻撃は失敗。 -20点`);}el("quizExp").textContent=state.quiz.exp;el("quizNextBtn").style.display="inline-block";}
function aiTurn(){const targets=attackablesFor("enemy");let pool=targets.length?targets:neutralPrefs().map(p=>p.id);if(!pool.length)return;const t=getPref(pool[Math.floor(Math.random()*pool.length)]);if(!t)return;const success=Math.random()<0.65;if(success){const prev=t.owner;t.owner="enemy";if(prev==="player")log(`敵AIが${t.name}をうばいました！`);else log(`敵AIが${t.name}を獲得。`);}else log(`敵AIの${t.name}攻撃は失敗。`);}
function nextTurn(){aiTurn();state.turn++;state.selected=null;setScreen("game");renderGame();}
function finishGame(){setScreen("result");const p=countOwner("player"),e=countOwner("enemy"),ans=state.correct+state.wrong,acc=ans?Math.round(state.correct/ans*100):0;const winner=p===e?"引き分け":p>e?"プレイヤーの勝ち！":"敵AIの勝ち";el("resultTitle").textContent=winner;el("resultSummary").textContent=`終了理由: ${state.gameOverReason}`;el("finalStats").innerHTML=`<p>プレイヤー獲得: ${p}県</p><p>敵AI獲得: ${e}県</p><p>正解率: ${acc}%</p><p>最終スコア: ${state.score}</p>`;saveStats(true,p,acc);}
function storage(){try{return window.localStorage;}catch{return null;}}
function safeLoadRecord(){const init={bestScore:0,bestPref:0,bestAcc:0,completeCount:0};const s=storage();if(!s){state.storageOk=false;return init;}try{const raw=s.getItem("jintoriRecord");if(!raw)return init;const d=JSON.parse(raw);return {...init,...(typeof d==="object"&&d?d:{})};}catch{return init;}}
function safeSaveRecord(data){const s=storage();if(!s){state.storageOk=false;return;}try{s.setItem("jintoriRecord",JSON.stringify(data));}catch{state.storageOk=false;}}
function loadRecord(){const d=safeLoadRecord();el("recordCard").innerHTML=`<h3>記録</h3><p>最高スコア: ${d.bestScore}点</p><p>最高獲得県数: ${d.bestPref}県</p><p>最高正解率: ${d.bestAcc}%</p><p>全国制覇回数: ${d.completeCount}回</p>${state.storageOk?"":"<p>記録保存が使えない環境です</p>"}`;}
function saveStats(isEnd,prefCount=0,acc=0){if(!isEnd)return;const d=safeLoadRecord();d.bestScore=Math.max(d.bestScore||0,state.score);d.bestPref=Math.max(d.bestPref||0,prefCount);d.bestAcc=Math.max(d.bestAcc||0,acc);if(prefCount===47)d.completeCount=(d.completeCount||0)+1;safeSaveRecord(d);}
function setup(){initPrefs();state.turn=1;state.correct=0;state.wrong=0;state.score=0;state.logs=[];state.selected=null;state.conqueredRegions=new Set();state.gameOverReason="";state.storageOk=true;loadRecord();
el("howtoBtn").onclick=()=>{const c=el("howtoCard");c.style.display=c.style.display==="none"?"block":"none";};
el("startBtn").onclick=()=>{state.selected=null;mapHtml("baseMap","base");el("baseConfirmBtn").disabled=true;el("baseMsg").textContent="";setScreen("base");};
el("backTitleBtn").onclick=()=>setScreen("title");
el("baseConfirmBtn").onclick=()=>{const p=getPref(state.selected);if(!p){el("baseMsg").textContent="都道府県を選んでください。";return;}p.owner="player";state.playerBase=p.id;const pool=state.prefs.filter(x=>x.id!==p.id);const enemy=pool[Math.floor(Math.random()*pool.length)];enemy.owner="enemy";state.enemyBase=enemy.id;log(`プレイヤー本拠地: ${p.name}`);log(`敵AI本拠地: ${enemy.name}`);setScreen("game");renderGame();};
el("attackBtn").onclick=()=>{const p=getPref(state.selected);if(!p){log("攻める県を選んでください。");return;}if(reasonCannotAttack(p)!=="攻撃可能"){log(`その県は攻められません（${reasonCannotAttack(p)}）`);return;}startQuiz();};
el("expeditionBtn").onclick=()=>{const n=neutralPrefs();if(!n.length){log("遠征先がありません。");return;}const t=n[Math.floor(Math.random()*n.length)];state.selected=t.id;log(`遠征！ ${t.name}を選びました。`);startQuiz();};
el("quizNextBtn").onclick=()=>nextTurn();
el("retryBtn").onclick=()=>{setup();setScreen("title");};}
setup();
</script>
</body>
